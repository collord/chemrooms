name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: client
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_DATA_URL: ./data
        run: npx vite build

      - name: Copy parquet data and Cesium assets into build output
        working-directory: client
        run: |
          cp -r ../server/data dist/data
          mkdir -p dist/cesium
          cp -r node_modules/cesium/Build/Cesium/Assets dist/cesium/Assets
          cp -r node_modules/cesium/Build/Cesium/ThirdParty dist/cesium/ThirdParty
          cp -r node_modules/cesium/Build/Cesium/Workers dist/cesium/Workers
          cp -r node_modules/cesium/Build/Cesium/Widgets dist/cesium/Widgets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
