<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chemrooms</title>

    <!--
      Preload DuckDB-WASM from jsDelivr in parallel with the main bundle.
      Without this, the 6.8MB WASM doesn't start downloading until after the
      main JS bundle has parsed and DuckDB-WASM gets initialized — adding
      almost a full second to time-to-interactive on a cold load.

      __DUCKDB_WASM_VERSION__ is replaced at build and dev time with the
      version SQLRooms' connector loads (vite.config.ts,
      duckdbWasmPreloadVersion). It was hand-written once, and went stale:
      the page preloaded 1.31.0's engine and then loaded 1.32.0's.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="fetch"
      crossorigin="anonymous"
      type="application/wasm"
      href="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@__DUCKDB_WASM_VERSION__/dist/duckdb-eh.wasm"
    />
    <link
      rel="preload"
      as="script"
      crossorigin="anonymous"
      href="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@__DUCKDB_WASM_VERSION__/dist/duckdb-browser-eh.worker.js"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
